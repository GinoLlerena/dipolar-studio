# Workspace root (not a package). Members live in packages/*.
[project]
name = "dipolar-studio-workspace"
version = "0.0.0"
description = "Workspace for Dipolar Studio (not published)"
requires-python = ">=3.12"
dependencies = ["dipolar-core", "dipolar-app"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "jsonschema>=4.23",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "pyyaml>=6.0",
]
# Phase 2 V0.3 dataset tools only (tools/datasets/*); not installed by default.
datasets = [
    "pypdf==7.1.1",
    "pillow==13.0.0",
    "pdfminer.six==20260107",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dipolar-core = { workspace = true }
dipolar-app = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "spikes", "packages/dipolar-core/tests", "packages/dipolar-app/tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running statistical checks (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web", "tools/legacy-harness", "datasets", "docs", "*.md"]  # dataset scripts are frozen, numpy-only prototypes

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters and primes are intentional in physics text

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/dipolar-core/src", "packages/dipolar-app/src", "tools/robot", "tools/codegen", "spikes"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "jsonschema.*"]  # no bundled stubs; used only by the spikes and tests
ignore_missing_imports = true
