name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync locked environment
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict, packages)
        run: uv run mypy
      - name: Generated TypeScript contract is current
        run: uv run python tools/codegen/ts_contract.py --check
      - name: Tests (frozen fixtures, boundaries)
        run: uv run pytest -m "not slow"

  windows:
    # Spike 3: the msvcrt project lock, Windows paths and line endings. POSIX-only checks (mode bits,
    # symlinks, SIGKILL, select on pipes, the launch directory's ownership) are skipped there.
    name: Python on Windows (tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync locked environment
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q -m "not slow"

  web:
    name: Web (strict typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pnpm
        run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Projection parity with the Python renderer (04 §8.4)
        run: pnpm run parity
      - name: Client unit tests (formatter, change feed)
        run: pnpm test

  packaged:
    name: Packaged build (D10 negative tests on the installed wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install uv and pnpm
        run: |
          python -m pip install --upgrade uv
          npm install -g pnpm@9
      - name: Build the wheels (page bundled)
        run: tools/package/build.sh
      - name: Install the wheels into a clean virtualenv
        run: |
          uv venv "$RUNNER_TEMP/pkg"
          uv pip install --python "$RUNNER_TEMP/pkg/bin/python" dist/packages/*.whl
      - name: D10 spike against the installed package
        run: |
          uv sync --locked
          DIPOLAR_BIN="$RUNNER_TEMP/pkg/bin/dipolar" uv run pytest spikes/test_spike_d10_localhost.py

  legacy-goldens:
    name: Legacy goldens (1998 solvers)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the 1998 application (read-only reference)
        uses: actions/checkout@v7
        with:
          repository: GinoLlerena/NMRApllication
          ref: 34a0bff16a1a8f481a322d3ba3be6e4cf11ad6e0  # 34a0bff
          path: legacy
      - name: Compile and compare with frozen output
        run: LEGACY="$GITHUB_WORKSPACE/legacy" tools/legacy-harness/run.sh
