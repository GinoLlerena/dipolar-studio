[project]
name = "dipolar-core"
version = "0.0.1.dev0"
description = "Pure scientific core of Dipolar Studio: geometry, dipolar physics and inference (no I/O, no UI)"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]  # a copy of the repository LICENSE (tests/test_boundaries.py keeps it equal)
authors = [{ name = "Gino Llerena" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dipolar_core"]
