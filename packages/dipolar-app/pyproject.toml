[project]
name = "dipolar-app"
version = "0.0.1.dev0"
description = "Headless application layer of Dipolar Studio: operation registry, session, event log, view state"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]  # a copy of the repository LICENSE (tests/test_boundaries.py keeps it equal)
authors = [{ name = "Gino Llerena" }]
requires-python = ">=3.12"
dependencies = [
    "dipolar-core",
    "pydantic>=2.10",
    "starlette>=1.0",
    "uvicorn>=0.34",
]

[project.scripts]
dipolar = "dipolar_app.cli:main"

[tool.uv.sources]
dipolar-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dipolar_app"]
artifacts = ["src/dipolar_app/static/**"]  # the built page, copied in by tools/package/build.sh (git-ignored)
