[project]
name = "dipolar-app"
version = "0.0.1.dev0"
description = "Headless application layer of Dipolar Studio: operation registry, session, event log, view state"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Gino Llerena" }]
requires-python = ">=3.12"
dependencies = ["dipolar-core"]

[tool.uv.sources]
dipolar-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dipolar_app"]
